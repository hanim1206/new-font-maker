  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  #font-maker-mobile-v3 .fmv3-full-page &gt; p {

    #font-maker-mobile-v3 .fmv3-side-glyph {

&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;font-maker-mobile-v3&#x27;);
    const screen = root.querySelector(&#x27;.fmv3-screen&#x27;);
    let step = 0;
    let flatness = 60;
    let angle = 25;

    const icon = (name) =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;

    const appbar = (title, backAction = &#x27;editor&#x27;, showHistory = true) =&gt; `
      &lt;header class=&quot;fmv3-appbar&quot;&gt;
        &lt;button class=&quot;fmv3-icon-button&quot; type=&quot;button&quot; data-action=&quot;${backAction}&quot; aria-label=&quot;뒤로 가기&quot;&gt;${icon(&#x27;chevron-left&#x27;)}&lt;/button&gt;
        &lt;strong&gt;${title}&lt;/strong&gt;
        ${showHistory
          ? `&lt;button class=&quot;fmv3-icon-button&quot; type=&quot;button&quot; data-action=&quot;history&quot; aria-label=&quot;편집 히스토리&quot;&gt;${icon(&#x27;history&#x27;)}&lt;/button&gt;`
          : &#x27;&lt;span&gt;&lt;/span&gt;&#x27;}
      &lt;/header&gt;`;

    const modeHeader = (active = &#x27;&#x27;) =&gt; `
      &lt;div class=&quot;fmv3-editor-head&quot;&gt;
        &lt;div class=&quot;fmv3-editor-title&quot;&gt;
          &lt;strong&gt;곰 편집&lt;/strong&gt;
          &lt;span class=&quot;fmv3-active-label&quot;&gt;중성 ㅗ 활성&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-mode-row&quot;&gt;
          &lt;button class=&quot;fmv3-mode-button&quot; type=&quot;button&quot; data-action=&quot;style&quot; aria-pressed=&quot;${String(active === &#x27;style&#x27;)}&quot;&gt;획 스타일&lt;/button&gt;
          &lt;button class=&quot;fmv3-mode-button&quot; type=&quot;button&quot; data-action=&quot;layout&quot; aria-pressed=&quot;${String(active === &#x27;layout&#x27;)}&quot;&gt;글자 배치&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;

    const glyph = (selected = &#x27;&#x27;) =&gt; `
      &lt;div class=&quot;fmv3-composed-glyph&quot; role=&quot;img&quot; aria-label=&quot;곰, 중성 ㅗ가 활성화됨&quot;&gt;
        &lt;span class=&quot;fmv3-glyph-part initial ${selected === &#x27;stroke&#x27; ? &#x27;is-selected&#x27; : &#x27;&#x27;}&quot;&gt;ㄱ${selected === &#x27;stroke&#x27; ? &#x27;&lt;i class=&quot;fmv3-point&quot;&gt;&lt;/i&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;
        &lt;span class=&quot;fmv3-glyph-part medial ${selected ? &#x27;&#x27; : &#x27;is-active&#x27;}&quot;&gt;ㅗ&lt;/span&gt;
        &lt;span class=&quot;fmv3-glyph-part final&quot;&gt;ㅁ&lt;/span&gt;
      &lt;/div&gt;`;

    const carousel = (selected = &#x27;&#x27;, fast = false) =&gt; `
      &lt;div class=&quot;fmv3-workspace&quot;&gt;
        ${fast ? `
          &lt;div class=&quot;fmv3-fast-picker&quot; aria-label=&quot;중성 빠른 탐색&quot;&gt;
            &lt;small&gt;누르고 좌우로 밀어 중성 선택 · 손을 떼면 확정&lt;/small&gt;
            &lt;div class=&quot;fmv3-fast-row&quot;&gt;&lt;span&gt;ㅏ&lt;/span&gt;&lt;span&gt;ㅑ&lt;/span&gt;&lt;span&gt;ㅓ&lt;/span&gt;&lt;span&gt;ㅕ&lt;/span&gt;&lt;span class=&quot;is-current&quot;&gt;ㅗ&lt;/span&gt;&lt;span&gt;ㅛ&lt;/span&gt;&lt;span&gt;ㅜ&lt;/span&gt;&lt;span&gt;ㅠ&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;` : &#x27;&#x27;}
        &lt;div class=&quot;fmv3-carousel&quot;&gt;
          &lt;div class=&quot;fmv3-side-glyph&quot;&gt;굠&lt;/div&gt;
          &lt;div class=&quot;fmv3-glyph-stage&quot;&gt;${glyph(selected)}&lt;/div&gt;
          &lt;div class=&quot;fmv3-side-glyph&quot;&gt;굼&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-carousel-hint&quot;&gt;활성 중성만 바뀝니다 · 길게 눌러 빠른 탐색&lt;/div&gt;
      &lt;/div&gt;`;

    const trackpad = (active = false, axis = &#x27;xy&#x27;) =&gt; `
      &lt;section class=&quot;fmv3-drawer&quot; aria-label=&quot;정밀 편집 트랙패드&quot;&gt;
        &lt;div class=&quot;fmv3-grabber&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fmv3-drawer-head&quot;&gt;
          &lt;strong&gt;${active ? &#x27;초성 ㄱ · 1번 획 · 끝점&#x27; : &#x27;정밀 편집&#x27;}&lt;/strong&gt;
          &lt;span&gt;${active ? &#x27;가로 +0.003 · 세로 −0.002&#x27; : &#x27;대상을 선택하세요&#x27;}&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-trackpad ${active ? axis : &#x27;idle&#x27;}&quot;&gt;
          &lt;div class=&quot;fmv3-trackpad-grid&quot;&gt;&lt;/div&gt;
          ${active ? `&lt;span class=&quot;fmv3-touch-point&quot;&gt;${axis === &#x27;x&#x27; ? &#x27;↔&#x27; : &#x27;↕↔&#x27;}&lt;/span&gt;` : &#x27;&#x27;}
          ${axis === &#x27;x&#x27; ? `&lt;span class=&quot;fmv3-locked-axis&quot;&gt;${icon(&#x27;lock&#x27;)} 세로 잠금&lt;/span&gt;` : &#x27;&#x27;}
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-track-actions&quot;&gt;
          &lt;button type=&quot;button&quot; aria-pressed=&quot;${String(active)}&quot;&gt;정밀&lt;/button&gt;
          &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;가로 잠금&lt;/button&gt;
          &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;세로 잠금&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;`;

    const styleDrawer = () =&gt; `
      &lt;section class=&quot;fmv3-drawer&quot; aria-label=&quot;폰트 전체 획 스타일&quot;&gt;
        &lt;div class=&quot;fmv3-grabber&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fmv3-drawer-head&quot;&gt;
          &lt;strong&gt;획 스타일&lt;/strong&gt;
          &lt;button class=&quot;fmv3-text-button&quot; type=&quot;button&quot; data-action=&quot;editor&quot;&gt;완료&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-scope&quot;&gt;폰트 전체에 적용&lt;/div&gt;
        &lt;div class=&quot;fmv3-segment&quot; role=&quot;group&quot; aria-label=&quot;붓촉 모양&quot;&gt;
          &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;원형&lt;/button&gt;
          &lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;납작형&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-style-controls&quot;&gt;
          &lt;label&gt;
            &lt;span class=&quot;fmv3-control-head&quot;&gt;&lt;span&gt;납작함&lt;/span&gt;&lt;output id=&quot;fmv3-flatness-output&quot;&gt;${flatness}&lt;/output&gt;&lt;/span&gt;
            &lt;input class=&quot;fmv3-range&quot; id=&quot;fmv3-flatness&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;${flatness}&quot;&gt;
          &lt;/label&gt;
          &lt;label&gt;
            &lt;span class=&quot;fmv3-control-head&quot;&gt;&lt;span&gt;각도&lt;/span&gt;&lt;output id=&quot;fmv3-angle-output&quot;&gt;+${angle}°&lt;/output&gt;&lt;/span&gt;
            &lt;input class=&quot;fmv3-range&quot; id=&quot;fmv3-angle&quot; type=&quot;range&quot; min=&quot;-90&quot; max=&quot;90&quot; value=&quot;${angle}&quot;&gt;
          &lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-drawer-footer&quot;&gt;
          &lt;button class=&quot;fmv3-action&quot; type=&quot;button&quot; data-action=&quot;compare&quot;&gt;변경 전 비교&lt;/button&gt;
          &lt;button class=&quot;fmv3-action&quot; type=&quot;button&quot; data-action=&quot;history&quot;&gt;히스토리&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;`;

    const editorScreen = (kind) =&gt; {
      const isFast = kind === &#x27;fast&#x27;;
      const isStroke = kind === &#x27;stroke&#x27;;
      const isStyle = kind === &#x27;style&#x27;;
      return `${appbar(&#x27;글자 편집&#x27;)}${modeHeader(isStyle ? &#x27;style&#x27; : &#x27;&#x27;)}${carousel(isStroke ? &#x27;stroke&#x27; : &#x27;&#x27;, isFast)}${isStyle ? styleDrawer() : trackpad(isStroke)}`;
    };

    const layoutScreen = () =&gt; `
      ${appbar(&#x27;글자 배치&#x27;)}
      &lt;div class=&quot;fmv3-editor-head&quot;&gt;
        &lt;div class=&quot;fmv3-editor-title&quot;&gt;&lt;strong&gt;곰 · 글자 배치&lt;/strong&gt;&lt;span class=&quot;fmv3-active-label&quot;&gt;분할선 선택&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;fmv3-scope&quot;&gt;가로모음 + 받침 전체에 적용&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fmv3-layout-workspace&quot;&gt;
        &lt;div class=&quot;fmv3-layout-canvas&quot; aria-label=&quot;초성 중성 종성 배치 영역&quot;&gt;
          &lt;div class=&quot;fmv3-layout-box initial&quot;&gt;초성&lt;/div&gt;
          &lt;div class=&quot;fmv3-layout-box medial&quot;&gt;중성&lt;/div&gt;
          &lt;div class=&quot;fmv3-layout-box final&quot;&gt;종성&lt;/div&gt;
          &lt;div class=&quot;fmv3-split-line&quot; aria-label=&quot;초성과 중성 사이 분할선&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-representatives&quot; aria-label=&quot;변경 영향을 받는 대표 글자&quot;&gt;&lt;span&gt;곰&lt;/span&gt;&lt;span&gt;눈&lt;/span&gt;&lt;span&gt;금&lt;/span&gt;&lt;span&gt;글&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      ${trackpad(true, &#x27;x&#x27;)}`;

    const historyScreen = () =&gt; `
      ${appbar(&#x27;편집 히스토리&#x27;, &#x27;editor&#x27;, false)}
      &lt;main class=&quot;fmv3-full-page&quot;&gt;
        &lt;h2&gt;편집 히스토리&lt;/h2&gt;
        &lt;p&gt;항목을 눌러 과거와 현재를 비교합니다&lt;/p&gt;
        &lt;div class=&quot;fmv3-history-list&quot;&gt;
          &lt;button class=&quot;fmv3-history-item&quot; type=&quot;button&quot; data-action=&quot;compare&quot;&gt;&lt;small&gt;방금 · 획 스타일&lt;/small&gt;&lt;strong&gt;각도 0° → +25°&lt;/strong&gt;&lt;span&gt;폰트 전체&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;fmv3-history-item&quot; type=&quot;button&quot; data-action=&quot;compare&quot;&gt;&lt;small&gt;오후 3:41 · 초성 ㄱ&lt;/small&gt;&lt;strong&gt;1번 획 끝점을 오른쪽으로 이동&lt;/strong&gt;&lt;span&gt;ㄱ 위쪽형 · 현재 레이아웃 보정&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;fmv3-history-item&quot; type=&quot;button&quot; data-action=&quot;compare&quot;&gt;&lt;small&gt;오후 3:36 · 글자 배치&lt;/small&gt;&lt;strong&gt;초성·중성 분할선 이동&lt;/strong&gt;&lt;span&gt;가로모음 + 받침 전체&lt;/span&gt;&lt;/button&gt;
        &lt;/div&gt;
      &lt;/main&gt;`;

    const compareScreen = () =&gt; `
      ${appbar(&#x27;과거 상태 비교&#x27;, &#x27;history&#x27;, false)}
      &lt;main class=&quot;fmv3-full-page&quot;&gt;
        &lt;h2&gt;오후 3:41 상태&lt;/h2&gt;
        &lt;p&gt;복원해도 이후 기록은 삭제되지 않습니다&lt;/p&gt;
        &lt;div class=&quot;fmv3-compare-grid&quot;&gt;
          &lt;div class=&quot;fmv3-snapshot&quot;&gt;&lt;small&gt;선택한 시점&lt;/small&gt;&lt;span&gt;곰&lt;/span&gt;&lt;strong&gt;끝점 이동 전&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;fmv3-snapshot is-current&quot;&gt;&lt;small&gt;현재&lt;/small&gt;&lt;span&gt;곰&lt;/span&gt;&lt;strong&gt;끝점 이동 후&lt;/strong&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;fmv3-compare-meta&quot;&gt;
          &lt;span&gt;&lt;strong&gt;대상&lt;/strong&gt; · 초성 ㄱ · 1번 획 끝점&lt;/span&gt;
          &lt;span&gt;&lt;strong&gt;범위&lt;/strong&gt; · ㄱ 위쪽형 · 현재 레이아웃 보정&lt;/span&gt;
          &lt;span&gt;&lt;strong&gt;변경&lt;/strong&gt; · 가로 +0.003&lt;/span&gt;
        &lt;/div&gt;
        &lt;button class=&quot;fmv3-action primary&quot; type=&quot;button&quot; data-action=&quot;restore&quot; style=&quot;width:100%&quot;&gt;이 시점으로 복원&lt;/button&gt;
      &lt;/main&gt;`;

    const render = () =&gt; {
      if (step === 0) screen.innerHTML = editorScreen(&#x27;select&#x27;);
      if (step === 1) screen.innerHTML = editorScreen(&#x27;fast&#x27;);
      if (step === 2) screen.innerHTML = editorScreen(&#x27;stroke&#x27;);
      if (step === 3) screen.innerHTML = editorScreen(&#x27;style&#x27;);
      if (step === 4) screen.innerHTML = layoutScreen();
      if (step === 5) screen.innerHTML = historyScreen();
      if (step === 6) screen.innerHTML = compareScreen();

      root.querySelectorAll(&#x27;[data-step]&#x27;).forEach((button) =&gt; {
        button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.step) === step));
      });

      const flatnessInput = root.querySelector(&#x27;#fmv3-flatness&#x27;);
      const angleInput = root.querySelector(&#x27;#fmv3-angle&#x27;);
      if (flatnessInput) {
        flatnessInput.addEventListener(&#x27;input&#x27;, (event) =&gt; {
          flatness = Number(event.target.value);
          root.querySelector(&#x27;#fmv3-flatness-output&#x27;).textContent = String(flatness);
        });
      }
      if (angleInput) {
        angleInput.addEventListener(&#x27;input&#x27;, (event) =&gt; {
          angle = Number(event.target.value);
          root.querySelector(&#x27;#fmv3-angle-output&#x27;).textContent = `${angle &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${angle}°`;
        });
      }

      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    };

    root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      const stepButton = event.target.closest(&#x27;[data-step]&#x27;);
      if (stepButton) {
        step = Number(stepButton.dataset.step);
        render();
        return;
      }

      const actionButton = event.target.closest(&#x27;[data-action]&#x27;);
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      if (action === &#x27;style&#x27;) step = 3;
      if (action === &#x27;layout&#x27;) step = 4;
      if (action === &#x27;history&#x27;) step = 5;
      if (action === &#x27;compare&#x27;) step = 6;
      if (action === &#x27;editor&#x27; || action === &#x27;restore&#x27;) step = 2;
      render();
    });

    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
