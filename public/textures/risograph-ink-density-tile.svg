<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <filter id="ink" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.011" numOctaves="4" seed="88" stitchTiles="stitch" result="mottle"/>
    <feColorMatrix in="mottle" type="saturate" values="0" result="monoMottle"/>
    <feComponentTransfer in="monoMottle" result="density">
      <feFuncR type="table" tableValues="0.18 0.76"/>
      <feFuncG type="table" tableValues="0.18 0.76"/>
      <feFuncB type="table" tableValues="0.18 0.76"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.13 0.13" numOctaves="2" seed="4" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0" result="monoGrain"/>
    <feComponentTransfer in="monoGrain" result="fineGrain">
      <feFuncR type="table" tableValues="0.72 1"/>
      <feFuncG type="table" tableValues="0.72 1"/>
      <feFuncB type="table" tableValues="0.72 1"/>
    </feComponentTransfer>
    <feBlend in="density" in2="fineGrain" mode="multiply"/>
  </filter>
  <rect width="1024" height="1024" fill="#fff"/>
  <rect width="1024" height="1024" filter="url(#ink)" opacity="0.72"/>
</svg>
