# 무료 Supabase는 7일 동안 요청이 없으면 프로젝트를 멈춘다(로그인 · 저장이 다 막힌다).
# 사흘에 한 번 `font_projects`를 한 줄 읽어 깨워 둔다. 공개 키라 RLS가 빈 목록을 돌려주지만 DB까지 닿는다.
# 예약 실행은 기본 브랜치(main)에 있어야 돈다. 레포에 60일 커밋이 없으면 GitHub가 예약을 끈다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: font_projects 한 줄 읽기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "레포 비밀값 SUPABASE_URL · SUPABASE_ANON_KEY가 없다" >&2
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/font_projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          [ "$status" = "200" ]
