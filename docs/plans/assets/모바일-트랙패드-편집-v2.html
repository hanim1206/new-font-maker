  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;mobile-trackpad-editor-wireframe&quot;&gt;
  &lt;style&gt;
    #mobile-trackpad-editor-wireframe {
      --fm-ink: light-dark(#17191c, #f3f5f7);
      --fm-muted: light-dark(#69717c, #aeb6c0);
      --fm-phone: light-dark(#f3f5f7, #14171b);
      --fm-surface: light-dark(#ffffff, #22272d);
      --fm-soft: light-dark(#edf0f4, #191d22);
      --fm-line: light-dark(#cfd5dd, #49515b);
      --fm-accent: light-dark(#3976dd, #79a9ff);
      --fm-accent-ink: light-dark(#ffffff, #10151b);
      --fm-accent-soft: light-dark(#e6efff, #253a58);
      color: var(--fm-ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif;
    }
    #mobile-trackpad-editor-wireframe * { box-sizing: border-box; }
    #mobile-trackpad-editor-wireframe button { color: inherit; font: inherit; cursor: pointer; }
    #mobile-trackpad-editor-wireframe .stage-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    #mobile-trackpad-editor-wireframe .stage-nav button { min-height: 40px; padding: 8px 12px; border: 1px solid var(--fm-line); border-radius: 12px; background: var(--fm-surface); }
    #mobile-trackpad-editor-wireframe .stage-nav button[aria-pressed=&quot;true&quot;] { border-color: transparent; background: var(--fm-accent); color: var(--fm-accent-ink); }
    #mobile-trackpad-editor-wireframe .layout { display: grid; grid-template-columns: minmax(300px, 430px) minmax(240px, 1fr); gap: 24px; align-items: start; }
    #mobile-trackpad-editor-wireframe .phone { width: 100%; max-width: 430px; min-height: 810px; overflow: hidden; border-radius: 30px; background: var(--fm-phone); box-shadow: 0 10px 32px light-dark(rgba(20,24,30,.18), rgba(0,0,0,.42)); }
    #mobile-trackpad-editor-wireframe .topbar { height: 84px; padding: 18px 18px 0; background: var(--fm-surface); }
    #mobile-trackpad-editor-wireframe .statusbar { display: flex; justify-content: space-between; margin: 0 4px 13px; font-size: 12px; }
    #mobile-trackpad-editor-wireframe .appbar { display: grid; grid-template-columns: 68px 1fr 68px; align-items: center; min-height: 38px; }
    #mobile-trackpad-editor-wireframe .appbar-title { text-align: center; font-weight: 500; }
    #mobile-trackpad-editor-wireframe .appbar-side { display: flex; align-items: center; }

    #mobile-trackpad-editor-wireframe .nav-action { min-width: 44px; min-height: 38px; padding: 6px 8px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    #mobile-trackpad-editor-wireframe .nav-action.with-label { justify-content: flex-start; font-size: 12px; }
    #mobile-trackpad-editor-wireframe .editor { padding: 16px 16px 0; }
    #mobile-trackpad-editor-wireframe .selection-line { min-height: 30px; margin: 0 3px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #mobile-trackpad-editor-wireframe .selection-line strong { font-weight: 500; }
    #mobile-trackpad-editor-wireframe .mode-label { padding: 5px 9px; border-radius: 12px; background: var(--fm-accent-soft); color: light-dark(#234f8f, #c8ddff); font-size: 11px; white-space: nowrap; }
    #mobile-trackpad-editor-wireframe .carousel { display: grid; grid-template-columns: 55px 1fr 55px; gap: 9px; align-items: center; }
    #mobile-trackpad-editor-wireframe .side-glyph { height: 136px; border: 1px solid var(--fm-line); border-radius: 16px; background: var(--fm-surface); display: flex; align-items: center; justify-content: center; color: var(--fm-muted); font-size: 35px; overflow: hidden; }
    #mobile-trackpad-editor-wireframe .canvas { height: 236px; border: 1px solid var(--fm-line); border-radius: 22px; background: var(--fm-surface); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #mobile-trackpad-editor-wireframe .canvas svg { width: 100%; height: 100%; display: block; }
    #mobile-trackpad-editor-wireframe .canvas .layout-box { fill: var(--fm-soft); stroke: var(--fm-line); stroke-width: 1.5; }
    #mobile-trackpad-editor-wireframe .canvas .layout-label { fill: var(--fm-muted); font-size: 13px; text-anchor: middle; }
    #mobile-trackpad-editor-wireframe .canvas .active-line { stroke: var(--fm-accent); stroke-width: 4; stroke-linecap: round; }
    #mobile-trackpad-editor-wireframe .canvas .guide-line { stroke: var(--fm-line); stroke-width: 1; stroke-dasharray: 5 5; }
    #mobile-trackpad-editor-wireframe .canvas .active-area { fill: var(--fm-accent-soft); stroke: var(--fm-accent); stroke-width: 2; }
    #mobile-trackpad-editor-wireframe .canvas .glyph-muted { fill: none; stroke: var(--fm-line); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    #mobile-trackpad-editor-wireframe .canvas .stroke-active { fill: none; stroke: var(--fm-accent); stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    #mobile-trackpad-editor-wireframe .canvas .selection-box { fill: none; stroke: var(--fm-accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
    #mobile-trackpad-editor-wireframe .canvas .point { fill: var(--fm-surface); stroke: var(--fm-accent); stroke-width: 2; }
    #mobile-trackpad-editor-wireframe .canvas .point.active { fill: var(--fm-accent); stroke: var(--fm-accent); }
    #mobile-trackpad-editor-wireframe .canvas-hint { min-height: 32px; margin: 9px 0 10px; text-align: center; color: var(--fm-muted); font-size: 12px; }
    #mobile-trackpad-editor-wireframe .drawer { min-height: 330px; padding: 13px 20px 22px; border-radius: 27px 27px 0 0; background: var(--fm-surface); }
    #mobile-trackpad-editor-wireframe .grabber { width: 56px; height: 5px; margin: 0 auto 13px; border-radius: 3px; background: var(--fm-line); }
    #mobile-trackpad-editor-wireframe .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    #mobile-trackpad-editor-wireframe .drawer-head strong { font-weight: 500; }
    #mobile-trackpad-editor-wireframe .delta { color: var(--fm-muted); font-size: 11px; }
    #mobile-trackpad-editor-wireframe .tool-row { display: flex; gap: 7px; margin-bottom: 9px; }
    #mobile-trackpad-editor-wireframe .tool-row button { min-height: 36px; padding: 6px 10px; border: 1px solid var(--fm-line); border-radius: 18px; background: var(--fm-surface); font-size: 11px; }
    #mobile-trackpad-editor-wireframe .tool-row button[aria-pressed=&quot;true&quot;] { border-color: transparent; background: var(--fm-accent); color: var(--fm-accent-ink); }
    #mobile-trackpad-editor-wireframe .tool-row .precision { margin-left: auto; }
    #mobile-trackpad-editor-wireframe .trackpad { height: 166px; position: relative; overflow: hidden; border: 1px solid var(--fm-line); border-radius: 19px; background: var(--fm-soft); }
    #mobile-trackpad-editor-wireframe .trackpad::before, #mobile-trackpad-editor-wireframe .trackpad::after { content: &quot;&quot;; position: absolute; z-index: 1; background: var(--fm-line); }
    #mobile-trackpad-editor-wireframe .trackpad::before { top: 18px; bottom: 18px; left: 50%; width: 1px; }
    #mobile-trackpad-editor-wireframe .trackpad::after { left: 22px; right: 22px; top: 50%; height: 1px; }
    #mobile-trackpad-editor-wireframe .trackpad.axis-x::before { opacity: .22; }
    #mobile-trackpad-editor-wireframe .trackpad.axis-y::after { opacity: .22; }
    #mobile-trackpad-editor-wireframe .axis-band { position: absolute; z-index: 0; pointer-events: none; }
    #mobile-trackpad-editor-wireframe .axis-band.horizontal { left: 18px; right: 18px; top: calc(50% - 24px); height: 48px; border-radius: 24px; background: linear-gradient(90deg, transparent, var(--fm-accent-soft) 28%, var(--fm-accent-soft) 72%, transparent); }
    #mobile-trackpad-editor-wireframe .axis-band.vertical { top: 16px; bottom: 16px; left: calc(50% - 24px); width: 48px; border-radius: 24px; background: linear-gradient(180deg, transparent, var(--fm-accent-soft) 28%, var(--fm-accent-soft) 72%, transparent); }
    #mobile-trackpad-editor-wireframe .free-field { position: absolute; inset: 20px; border-radius: 50%; background: radial-gradient(circle, var(--fm-accent-soft), transparent 68%); }
    #mobile-trackpad-editor-wireframe .pad-dot { position: absolute; z-index: 3; width: 34px; height: 34px; left: calc(50% - 17px); top: calc(50% - 17px); border-radius: 50%; background: var(--fm-accent); color: var(--fm-accent-ink); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
    #mobile-trackpad-editor-wireframe .axis-lock { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 4px; color: var(--fm-muted); font-size: 11px; }
    #mobile-trackpad-editor-wireframe .axis-lock.vertical-lock { top: 9px; left: 50%; transform: translateX(-50%); }
    #mobile-trackpad-editor-wireframe .axis-lock.horizontal-lock { left: 8px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; }
    #mobile-trackpad-editor-wireframe .pad-caption { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--fm-muted); font-size: 11px; }
    #mobile-trackpad-editor-wireframe .drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; color: var(--fm-muted); font-size: 11px; }
    #mobile-trackpad-editor-wireframe .undo { min-height: 36px; padding: 6px 10px; border: 0; background: transparent; color: var(--fm-accent); }

  &lt;div class=&quot;stage-nav&quot; role=&quot;toolbar&quot; aria-label=&quot;모바일 트랙패드 편집 상태&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;layout&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;mobile-trackpad-editor-wireframe&#x27;);
      const state = { step: 0 };
      const steps = [
        {
          tab: &#x27;1 분할선&#x27;, title: &#x27;레이아웃 분할선&#x27;, mode: &#x27;레이아웃 편집&#x27;, target: &#x27;초성·중성 분할선&#x27;, hint: &#x27;분할선을 탭해 선택&#x27;, delta: &#x27;가로 +0.012&#x27;, axis: &#x27;x&#x27;,
          desc: &#x27;기존 분할 구조를 유지하며 선택된 선만 한 축으로 조절한다.&#x27;,
          bullets: [&#x27;분할 방향에 맞춰 축을 자동 제한&#x27;, &#x27;박스를 자유 좌표로 옮기지 않음&#x27;, &#x27;손을 떼면 한 번의 변경으로 저장&#x27;]
        },
        {
          tab: &#x27;2 패딩&#x27;, title: &#x27;레이아웃 패딩&#x27;, mode: &#x27;레이아웃 편집&#x27;, target: &#x27;초성 오른쪽 패딩&#x27;, hint: &#x27;패딩 경계를 탭해 선택&#x27;, delta: &#x27;가로 -0.006&#x27;, axis: &#x27;x&#x27;,
          desc: &#x27;바깥 박스가 아니라 선택한 패딩 경계를 안팎으로 움직인다.&#x27;,
          bullets: [&#x27;선택한 경계와 이동 방향을 함께 표시&#x27;, &#x27;중심선 스냅을 짧게 표시&#x27;, &#x27;레이아웃과 자소 형태 편집을 섞지 않음&#x27;]
        },
        {
          tab: &#x27;3 획&#x27;, title: &#x27;획 전체 선택&#x27;, mode: &#x27;자소 편집&#x27;, target: &#x27;초성 ㄱ · 1번 획&#x27;, hint: &#x27;획을 한 번 탭하면 전체 선택&#x27;, delta: &#x27;가로 +0.012 · 세로 -0.004&#x27;, axis: &#x27;xy&#x27;,
          desc: &#x27;글자 화면에서는 획만 선택하고 실제 이동은 트랙패드에서 수행한다.&#x27;,
          bullets: [&#x27;한 손가락 드래그로 2차원 이동&#x27;, &#x27;가로·세로 잠금을 필요할 때 선택&#x27;, &#x27;같은 획을 다시 탭하면 조절점 표시&#x27;]
        },
        {
          tab: &#x27;4 조절점&#x27;, title: &#x27;끝점·곡선점 선택&#x27;, mode: &#x27;자소 편집&#x27;, target: &#x27;초성 ㄱ · 1번 획 · 끝점&#x27;, hint: &#x27;표시된 점을 탭해 선택&#x27;, delta: &#x27;가로 +0.003 · 세로 -0.002&#x27;, axis: &#x27;xy&#x27;,
          desc: &#x27;선택한 점 하나만 정밀하게 움직여 획의 길이나 곡선을 바꾼다.&#x27;,
          bullets: [&#x27;정밀을 누르는 동안 낮은 감도로 고정&#x27;, &#x27;선택점 외 획과 레이아웃은 유지&#x27;, &#x27;관성 없이 손을 떼는 순간 멈춤&#x27;]

      ];

      const nav = root.querySelector(&#x27;.stage-nav&#x27;);
      steps.forEach((item, index) =&gt; {
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.textContent = item.tab;
        button.addEventListener(&#x27;click&#x27;, () =&gt; { state.step = index; render(); });
        nav.appendChild(button);

      function topbar() {
        return &#x27;&lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;statusbar&quot;&gt;&lt;span&gt;12:31&lt;/span&gt;&lt;span&gt;● Wi-Fi 74%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;appbar&quot;&gt;&lt;div class=&quot;appbar-side&quot;&gt;&lt;button class=&quot;nav-action with-label&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;뒤로&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;appbar-title&quot;&gt;곰 편집&lt;/div&gt;&lt;div class=&quot;appbar-side end&quot;&gt;&lt;button class=&quot;nav-action&quot; type=&quot;button&quot; aria-label=&quot;히스토리&quot;&gt;&lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      }

      function layoutDividerGraphic() {
        return &#x27;&lt;svg viewBox=&quot;0 0 240 220&quot; role=&quot;img&quot; aria-label=&quot;초성과 중성 사이 분할선이 선택된 레이아웃&quot;&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;25&quot; y=&quot;26&quot; width=&quot;97&quot; height=&quot;118&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;122&quot; y=&quot;26&quot; width=&quot;93&quot; height=&quot;118&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;25&quot; y=&quot;148&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;text class=&quot;layout-label&quot; x=&quot;73&quot; y=&quot;91&quot;&gt;초성&lt;/text&gt;&lt;text class=&quot;layout-label&quot; x=&quot;168&quot; y=&quot;91&quot;&gt;중성&lt;/text&gt;&lt;text class=&quot;layout-label&quot; x=&quot;120&quot; y=&quot;178&quot;&gt;종성&lt;/text&gt;&lt;line class=&quot;active-line&quot; x1=&quot;122&quot; y1=&quot;34&quot; x2=&quot;122&quot; y2=&quot;136&quot;&gt;&lt;/line&gt;&lt;circle class=&quot;point active&quot; cx=&quot;122&quot; cy=&quot;85&quot; r=&quot;7&quot;&gt;&lt;/circle&gt;&lt;/svg&gt;&#x27;;
      }

      function paddingGraphic() {
        return &#x27;&lt;svg viewBox=&quot;0 0 240 220&quot; role=&quot;img&quot; aria-label=&quot;초성 오른쪽 패딩 경계가 선택된 레이아웃&quot;&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;25&quot; y=&quot;26&quot; width=&quot;97&quot; height=&quot;118&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;122&quot; y=&quot;26&quot; width=&quot;93&quot; height=&quot;118&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;layout-box&quot; x=&quot;25&quot; y=&quot;148&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;active-area&quot; x=&quot;38&quot; y=&quot;40&quot; width=&quot;68&quot; height=&quot;90&quot; rx=&quot;6&quot;&gt;&lt;/rect&gt;&lt;line class=&quot;active-line&quot; x1=&quot;106&quot; y1=&quot;43&quot; x2=&quot;106&quot; y2=&quot;127&quot;&gt;&lt;/line&gt;&lt;line class=&quot;guide-line&quot; x1=&quot;122&quot; y1=&quot;26&quot; x2=&quot;122&quot; y2=&quot;144&quot;&gt;&lt;/line&gt;&lt;text class=&quot;layout-label&quot; x=&quot;72&quot; y=&quot;91&quot;&gt;초성&lt;/text&gt;&lt;text class=&quot;layout-label&quot; x=&quot;168&quot; y=&quot;91&quot;&gt;중성&lt;/text&gt;&lt;text class=&quot;layout-label&quot; x=&quot;120&quot; y=&quot;178&quot;&gt;종성&lt;/text&gt;&lt;/svg&gt;&#x27;;
      }

      function strokeGraphic(showPoints) {
        const points = showPoints ? &#x27;&lt;circle class=&quot;point&quot; cx=&quot;55&quot; cy=&quot;55&quot; r=&quot;7&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;point active&quot; cx=&quot;132&quot; cy=&quot;55&quot; r=&quot;8&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;point&quot; cx=&quot;132&quot; cy=&quot;123&quot; r=&quot;7&quot;&gt;&lt;/circle&gt;&#x27; : &#x27;&lt;rect class=&quot;selection-box&quot; x=&quot;39&quot; y=&quot;39&quot; width=&quot;109&quot; height=&quot;100&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;&#x27;;
        return &#x27;&lt;svg viewBox=&quot;0 0 240 220&quot; role=&quot;img&quot; aria-label=&quot;초성 기역의 &#x27; + (showPoints ? &#x27;끝점&#x27; : &#x27;획 전체&#x27;) + &#x27;이 선택된 글자&quot;&gt;&lt;path class=&quot;stroke-active&quot; d=&quot;M55 55 H132 V123&quot;&gt;&lt;/path&gt;&lt;path class=&quot;glyph-muted&quot; d=&quot;M76 151 H163 M120 144 V173&quot;&gt;&lt;/path&gt;&lt;rect class=&quot;glyph-muted&quot; x=&quot;74&quot; y=&quot;175&quot; width=&quot;92&quot; height=&quot;24&quot; rx=&quot;4&quot;&gt;&lt;/rect&gt;&#x27; + points + &#x27;&lt;/svg&gt;&#x27;;
      }

      function canvas(step) {
        const graphic = step === 0 ? layoutDividerGraphic() : step === 1 ? paddingGraphic() : strokeGraphic(step === 3);
        return &#x27;&lt;div class=&quot;editor&quot;&gt;&lt;div class=&quot;selection-line&quot;&gt;&lt;strong&gt;&#x27; + steps[step].mode + &#x27;&lt;/strong&gt;&lt;span class=&quot;mode-label&quot;&gt;&#x27; + steps[step].target + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;carousel&quot;&gt;&lt;div class=&quot;side-glyph&quot;&gt;놈&lt;/div&gt;&lt;div class=&quot;canvas&quot;&gt;&#x27; + graphic + &#x27;&lt;/div&gt;&lt;div class=&quot;side-glyph&quot;&gt;돔&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;canvas-hint&quot;&gt;&#x27; + steps[step].hint + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

      function trackpad(step) {

        const locks = item.axis === &#x27;xy&#x27; ? &#x27;&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;가로 잠금&lt;/button&gt;&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;세로 잠금&lt;/button&gt;&#x27; : &#x27;&lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&#x27; + (item.axis === &#x27;x&#x27; ? &#x27;가로만&#x27; : &#x27;세로만&#x27;) + &#x27;&lt;/button&gt;&#x27;;
        const field = item.axis === &#x27;x&#x27;
          ? &#x27;&lt;span class=&quot;axis-band horizontal&quot;&gt;&lt;/span&gt;&lt;span class=&quot;axis-lock vertical-lock&quot;&gt;&lt;i data-lucide=&quot;lock&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;세로 잠금&lt;/span&gt;&lt;span class=&quot;pad-dot&quot;&gt;↔&lt;/span&gt;&#x27;
          : item.axis === &#x27;y&#x27;
            ? &#x27;&lt;span class=&quot;axis-band vertical&quot;&gt;&lt;/span&gt;&lt;span class=&quot;axis-lock horizontal-lock&quot;&gt;&lt;i data-lucide=&quot;lock&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;가로 잠금&lt;/span&gt;&lt;span class=&quot;pad-dot&quot;&gt;↕&lt;/span&gt;&#x27;
            : &#x27;&lt;span class=&quot;free-field&quot;&gt;&lt;/span&gt;&lt;span class=&quot;axis-band horizontal&quot;&gt;&lt;/span&gt;&lt;span class=&quot;axis-band vertical&quot;&gt;&lt;/span&gt;&lt;span class=&quot;pad-dot&quot;&gt;↕↔&lt;/span&gt;&#x27;;
        return &#x27;&lt;div class=&quot;drawer&quot;&gt;&lt;div class=&quot;grabber&quot;&gt;&lt;/div&gt;&lt;div class=&quot;drawer-head&quot;&gt;&lt;strong&gt;&#x27; + item.target + &#x27;&lt;/strong&gt;&lt;span class=&quot;delta&quot;&gt;&#x27; + item.delta + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tool-row&quot;&gt;&#x27; + locks + &#x27;&lt;button class=&quot;precision&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;정밀 누르기&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;trackpad axis-&#x27; + item.axis + &#x27;&quot;&gt;&#x27; + field + &#x27;&lt;span class=&quot;pad-caption&quot;&gt;천천히 밀면 미세 조절 · 빠르게 밀면 크게 이동&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;drawer-foot&quot;&gt;&lt;span&gt;스냅 켜짐 · 손을 떼면 저장&lt;/span&gt;&lt;button class=&quot;undo&quot; type=&quot;button&quot;&gt;실행 취소&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
      }

      function render() {
        [...nav.children].forEach((button, index) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(index === state.step)));
        root.querySelector(&#x27;.phone-content&#x27;).innerHTML = topbar() + canvas(state.step) + trackpad(state.step);
        const item = steps[state.step];
        root.querySelector(&#x27;.notes h2&#x27;).textContent = item.title;
        root.querySelector(&#x27;.notes p&#x27;).textContent = item.desc;
        root.querySelector(&#x27;.notes ol&#x27;).innerHTML = item.bullets.map(point =&gt; &#x27;&lt;li&gt;&#x27; + point + &#x27;&lt;/li&gt;&#x27;).join(&#x27;&#x27;);
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();

    .getElementById(&quot;codex-visualization-lucide&quot;)
